# ------------------------------------------------------------
# 📱 FRONTEND TESTS (EXPO + JEST)
# Ejecuta pruebas de React Native con Jest y muestra un resumen visual
# ------------------------------------------------------------

name: Run Frontend Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # --- PASO 1: Checkout del repositorio ---
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- PASO 2: Configurar Node.js ---
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      # --- PASO 3: Instalar dependencias ---
      - name: Install dependencies
        run: npm ci

      # --- PASO 5: Ejecutar pruebas y generar JSON ---
      - name: Run Jest tests
        env:
          NODE_ENV: test
          EXPO_OS: android
        run: npm test -- --json --outputFile=__tests__/jest-results.json

      # --- PASO 6: Generar resumen visual en GitHub ---
      - name: Generate Test Summary
        if: always()
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          RESULTS_FILE="__tests__/jest-results.json"

          if [ -f "$RESULTS_FILE" ]; then
            PASSED=$(jq .numPassedTests "$RESULTS_FILE")
            FAILED=$(jq .numFailedTests "$RESULTS_FILE")
            TOTAL=$(jq .numTotalTests "$RESULTS_FILE")
            TIME=$(jq .testResults[0].perfStats.runtime "$RESULTS_FILE" | awk '{printf "%.1f", $1/1000}')
            
            SUMMARY_ICON="✅"
            if [ "$FAILED" -gt 0 ]; then
              SUMMARY_ICON="❌"
            fi

            SUMMARY_TEXT="$SUMMARY_ICON **$PASSED** tests passed — **$FAILED** failed — **$TOTAL** total — duration: **$TIME** s"
            echo "$SUMMARY_TEXT" >> $GITHUB_STEP_SUMMARY

            if [ "$FAILED" -gt 0 ]; then
              echo "## Detalles de la Ejecución" >> $GITHUB_STEP_SUMMARY
              echo "Consulta los logs para más información sobre los tests fallidos." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ **Advertencia:** No se encontró el archivo de resultados JSON. Las pruebas pudieron haber fallado antes de generarlo." >> $GITHUB_STEP_SUMMARY
          fi

      # --- PASO 7: Generar y subir reporte de cobertura ---
      - name: Generate coverage report
        if: success()
        run: npm run test:coverage

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
  # ------------------------------------------------------------
  # JOB 2: BUILD Y GENERACIÓN DE ARTEFACTO (AAB/APK)
  # ------------------------------------------------------------
  build-android:
    # 🚨 ¡IMPORTANTE! Solo se ejecuta si el job 'test' pasó.
    needs: test 
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      # 1. Instalar dependencias y EAS CLI
      - name: Install dependencies and EAS CLI
        run: |
          npm ci
          # Instalamos EAS CLI globalmente en el runner
          npm install -g eas-cli 

        
      # 2. Iniciar sesión en EAS usando el secreto
      - name: Login to EAS
        run: eas login
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        
      # 3. Ejecutar EAS Build para Android
      - name: EAS Build for Android (Production)
        run: eas build --platform android --profile production --non-interactive
        
      # 4. (Opcional) Ver el resultado
      - name: Report Build Status
        if: always() # Muestra el mensaje incluso si el build falla.
        run: |
          echo "El Build de EAS ha finalizado."
          echo "Consulta el log de este paso o visita la consola de Expo para el enlace de descarga del AAB/APK."
          echo "Consola de Builds: https://expo.dev/accounts/luis2256/projects/FilograficosApp/builds"